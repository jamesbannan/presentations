name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Content is fetched from other repositories at build time, so the token needs
# read access to them. For private content repos, set GH_TOKEN to a PAT instead.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build all decks
        run: npm run build:all
        env:
          GH_TOKEN: ${{ secrets.CONTENT_TOKEN || github.token }}

      - name: Add a landing page listing the decks
        run: node scripts/make-index.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
