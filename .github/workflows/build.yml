name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Content is fetched from other repositories at build time, so the token needs
# read access to them. For private content repos, set GH_TOKEN to a PAT instead.
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pages serves a project site under /<repo>/, so the decks need that
      # prefix baked into their asset URLs. This step reports it.
      - id: pages
        uses: actions/configure-pages@v6

      - name: Build all decks
        run: npm run build:all
        env:
          GH_TOKEN: ${{ secrets.CONTENT_TOKEN || github.token }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}

      - name: Add a landing page listing the decks
        run: node scripts/make-index.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
